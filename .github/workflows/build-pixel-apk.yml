name: Build Perche Camera Companion

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Pixel APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Find checkpoint ZIP
        id: checkpoint
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "No checkpoint ZIP found."
            exit 1
          fi

          echo "Using checkpoint: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

          sha256sum "$ZIP" | tee checkpoint-sha256.txt

      - name: Extract exact checkpoint
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p checkpoint
          unzip -q "${{ steps.checkpoint.outputs.zip }}" -d checkpoint

          PIXEL_DIR="$(find checkpoint -type d -name PixelCameraCompanion -print -quit)"

          if [ -z "$PIXEL_DIR" ]; then
            echo "PixelCameraCompanion directory not found."
            exit 1
          fi

          echo "PIXEL_DIR=$PIXEL_DIR" >> "$GITHUB_ENV"
          echo "PixelCameraCompanion found at: $PIXEL_DIR"

          test -f "$PIXEL_DIR/settings.gradle.kts"
          test -f "$PIXEL_DIR/build.gradle.kts"
          test -f "$PIXEL_DIR/app/build.gradle.kts"

      - name: Install Android SDK API 37
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0"

          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version
          gradle --version

      - name: Build real Android application
        id: android_build
        shell: bash
        run: |
          set -o pipefail

          cd "$PIXEL_DIR"

          gradle clean :app:assembleDebug \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee "$GITHUB_WORKSPACE/android-build.log"

      - name: Locate APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PIXEL_DIR/app/build/outputs/apk" \
              -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "Gradle succeeded but no APK was found."
            exit 1
          fi

          mkdir -p Release/Android

          cp "$APK" \
            Release/Android/PercheCameraCompanion-v15.0.1-debug.apk

          sha256sum \
            Release/Android/PercheCameraCompanion-v15.0.1-debug.apk \
            | tee Release/Android/SHA256.txt

          ls -lh Release/Android/

      - name: Inspect APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/Release/Android/PercheCameraCompanion-v15.0.1-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          "$AAPT" dump badging "$APK" \
            | tee Release/Android/APK-INFO.txt

          echo ""
          echo "===== APK SHA-256 ====="
          cat Release/Android/SHA256.txt

      - name: Insert APK into Perche Progression repository
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(find checkpoint -type d \
            -name PixelCameraCompanion \
            -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_ROOT" ]; then
            echo "Could not determine Perche Progression root."
            exit 1
          fi

          mkdir -p "$PROJECT_ROOT/Release/Android"

          cp Release/Android/PercheCameraCompanion-v15.0.1-debug.apk \
             "$PROJECT_ROOT/Release/Android/"

          cp Release/Android/SHA256.txt \
             "$PROJECT_ROOT/Release/Android/"

          cp Release/Android/APK-INFO.txt \
             "$PROJECT_ROOT/Release/Android/"

          cd checkpoint
          zip -qr \
            "$GITHUB_WORKSPACE/PercheProgression-v15.0.1-with-Pixel-Companion.zip" \
            .

      - name: Verify combined ZIP
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          unzip -t \
            PercheProgression-v15.0.1-with-Pixel-Companion.zip

          unzip -l \
            PercheProgression-v15.0.1-with-Pixel-Companion.zip \
            | grep 'PercheCameraCompanion-v15.0.1-debug.apk'

      - name: Upload APK and combined project
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PercheProgression-v15.0.1-Android-Build
          retention-days: 7
          path: |
            Release/Android/PercheCameraCompanion-v15.0.1-debug.apk
            Release/Android/SHA256.txt
            Release/Android/APK-INFO.txt
            PercheProgression-v15.0.1-with-Pixel-Companion.zip
            android-build.log
            checkpoint-sha256.txt

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Failure-Log
          retention-days: 7
          path: |
            android-build.log
            checkpoint-sha256.txt
